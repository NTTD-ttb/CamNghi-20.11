<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kỷ Niệm 43 Năm Ngày Nhà Giáo Việt Nam 20-11</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cam: #e8672a;
        --xam: #6b6b6b;
        --dam: #2c1a0e;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Be Vietnam Pro", sans-serif;
        background: linear-gradient(
          135deg,
          #fce8de 0%,
          #fdf5f0 50%,
          #fce8de 100%
        );
        min-height: 100vh;
        color: var(--dam);
      }
      .page {
        display: grid;
        grid-template-columns: 380px 1fr;
        min-height: 100vh;
      }

      .panel-trai {
        background: white;
        border-right: 1px solid #f0d8cc;
        padding: 28px 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        overflow-y: auto;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .logo-header {
        text-align: center;
        padding-bottom: 16px;
        border-bottom: 1px solid #f0d8cc;
      }
      .logo-header h1 {
        font-family: "Playfair Display", serif;
        font-size: 15px;
        color: var(--cam);
        line-height: 1.4;
        font-weight: 700;
      }
      .logo-header p {
        font-size: 11px;
        color: var(--xam);
        margin-top: 4px;
      }
      .section-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--cam);
        margin-bottom: 8px;
      }

      .upload-zone {
        border: 2px dashed #f0a07a;
        border-radius: 14px;
        padding: 20px 16px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        background: #fff8f5;
      }
      .upload-zone:hover {
        border-color: var(--cam);
        background: #fff2ec;
      }
      .upload-zone.has-img {
        border-style: solid;
        border-color: var(--cam);
      }
      .upload-icon {
        width: 40px;
        height: 40px;
        background: #fce8de;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 10px;
      }
      .upload-icon svg {
        width: 20px;
        height: 20px;
        stroke: var(--cam);
      }
      .upload-zone p {
        font-size: 13px;
        color: var(--xam);
        line-height: 1.5;
      }
      .upload-zone strong {
        color: var(--cam);
      }
      #fileInput {
        display: none;
      }

      .adj-group {
        display: none;
      }
      .adj-group.show {
        display: block;
      }
      .adj-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .adj-row label {
        font-size: 12px;
        color: var(--xam);
        min-width: 60px;
      }
      .adj-row input[type="range"] {
        flex: 1;
        accent-color: var(--cam);
        height: 4px;
      }
      .adj-row span {
        font-size: 12px;
        color: var(--dam);
        min-width: 36px;
        text-align: right;
      }
      .move-hint {
        background: #fff8f5;
        border: 1px solid #f0d0b8;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 12px;
        color: var(--xam);
        line-height: 1.6;
      }

      .input-wrap {
        margin-bottom: 4px;
      }
      .inp {
        width: 100%;
        border: 1.5px solid #f0d0b8;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        font-family: "Be Vietnam Pro", sans-serif;
        color: var(--dam);
        background: #fffaf8;
        transition: border-color 0.2s;
        outline: none;
      }
      .inp:focus {
        border-color: var(--cam);
        background: white;
      }
      textarea.inp {
        resize: none;
        line-height: 1.6;
      }

      .btn-tai {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, var(--cam), #d4561e);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        font-family: "Be Vietnam Pro", sans-serif;
        cursor: pointer;
        transition: all 0.2s;
        letter-spacing: 0.02em;
        margin-top: auto;
      }
      .btn-tai:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(232, 103, 42, 0.4);
      }
      .btn-tai:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .save-status {
        text-align: center;
        font-size: 12px;
        color: var(--xam);
        min-height: 18px;
      }
      .save-status.ok {
        color: #2e7d32;
      }
      .save-status.err {
        color: #c62828;
      }

      .panel-phai {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        background: repeating-linear-gradient(
          45deg,
          transparent,
          transparent 10px,
          rgba(232, 103, 42, 0.03) 10px,
          rgba(232, 103, 42, 0.03) 20px
        );
      }
      .preview-label {
        font-size: 12px;
        color: var(--xam);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 12px;
        font-weight: 500;
      }
      .canvas-container {
        position: relative;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        border-radius: 8px;
        overflow: hidden;
        cursor: crosshair;
        user-select: none;
      }
      #previewCanvas {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .preview-note {
        margin-top: 12px;
        font-size: 12px;
        color: var(--xam);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="panel-trai">
        <div class="logo-header">
          <h1>🌻 Kỷ Niệm 43 Năm<br />Ngày Nhà Giáo Việt Nam</h1>
          <p>Điền thông tin → Xem trước → Tải về</p>
        </div>

        <div>
          <div class="section-label">📷 Ảnh đại diện</div>
          <div
            class="upload-zone"
            id="uploadZone"
            onclick="document.getElementById('fileInput').click()"
          >
            <div class="upload-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
            </div>
            <p><strong>Nhấn để chọn ảnh</strong><br />JPG, PNG, WEBP</p>
          </div>
          <input
            type="file"
            id="fileInput"
            accept="image/*"
            onchange="handleFile(event)"
          />
        </div>

        <div class="adj-group" id="adjGroup">
          <div class="section-label">🔧 Điều chỉnh ảnh</div>
          <div class="adj-row">
            <label>Phóng to</label>
            <input
              type="range"
              id="scaleSlider"
              min="50"
              max="300"
              value="100"
              oninput="updateScale(this)"
            />
            <span id="scaleVal">100%</span>
          </div>
          <div class="move-hint">
            👆 <strong>Kéo ảnh</strong> trong khung tròn để căn chỉnh vị trí
          </div>
        </div>

        <div class="input-wrap">
          <div class="section-label">👤 Họ và tên</div>
          <input
            class="inp"
            type="text"
            id="tenInput"
            placeholder="Nguyễn Văn A"
            oninput="redraw()"
          />
        </div>

        <div class="input-wrap">
          <div class="section-label">🏷️ Chức vụ</div>
          <input
            class="inp"
            type="text"
            id="cvInput"
            placeholder="Giảng viên Khoa CNTT"
            oninput="redraw()"
          />
        </div>

        <div class="input-wrap">
          <div class="section-label">✍️ Lời tri ân</div>
          <textarea
            class="inp"
            id="ndInput"
            rows="4"
            placeholder="Nhập lời nhắn gửi đến thầy cô..."
            oninput="redraw()"
          ></textarea>
        </div>

        <button class="btn-tai" id="btnTai" onclick="downloadAndSave()">
          ⬇️ Tải ảnh về
        </button>
        <div class="save-status" id="saveStatus"></div>
      </div>

      <div class="panel-phai">
        <div class="preview-label">Xem trước — kéo ảnh để căn chỉnh</div>
        <div class="canvas-container" id="canvasWrap">
          <canvas id="previewCanvas"></canvas>
        </div>
        <div class="preview-note">Kích thước xuất: 2048 × 1152 px</div>
      </div>
    </div>
    <script>
      const GOOGLE_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbyTwxV6I4rTNGdYOu3WXD5MAJek2mE0tJjYkqb4vknDlL9CBuqltuD0pHAaoHnouD1Uxw/exec";

      const CW = 2048,
        CH = 1152;
      const CIRCLE = {
        x: 150.2 + 543.4 / 2,
        y: 350.3 + 543.4 / 2,
        r: 543.4 / 2,
      };
      const RECT_CAM = { x: 56.5, y: 914.6, w: 727.1, h: 188.7 };
      const RECT_ND = { x: 876.2, y: 473.0, w: 1103.5, h: 640.9 };

      const bgImg = new Image();
      let bgLoaded = false;
      bgImg.onload = () => {
        bgLoaded = true;
        redraw();
      };
      bgImg.onerror = () => {
        bgLoaded = false;
        redraw();
      };
      bgImg.src = "background.png";

      let userImg = null,
        imgX = 0,
        imgY = 0,
        imgScale = 1;
      let isDragging = false,
        dragStartX = 0,
        dragStartY = 0,
        dragImgX = 0,
        dragImgY = 0;
      let previewScale = 1;

      const cvs = document.getElementById("previewCanvas");
      const ctx = cvs.getContext("2d");
      cvs.width = CW;
      cvs.height = CH;

      function calcPreviewScale() {
        const wrap = document.getElementById("canvasWrap");
        const maxW = wrap.parentElement.clientWidth - 48;
        const maxH = window.innerHeight - 80;
        previewScale = Math.min(maxW / CW, maxH / CH, 1);
        cvs.style.width = CW * previewScale + "px";
        cvs.style.height = CH * previewScale + "px";
      }
      window.addEventListener("resize", calcPreviewScale);
      calcPreviewScale();

      function drawBackground() {
        if (bgLoaded) {
          ctx.drawImage(bgImg, 0, 0, CW, CH);
          return;
        }
        let grad = ctx.createLinearGradient(0, 0, CW, CH);
        grad.addColorStop(0, "#fce0d0");
        grad.addColorStop(0.5, "#fdf5f0");
        grad.addColorStop(1, "#fce0d0");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, CW, CH);
        ctx.fillStyle = "#e8a070";
        [
          [400, 120],
          [600, 80],
          [900, 70],
          [1200, 90],
          [1500, 75],
          [1800, 100],
          [350, 160],
          [700, 140],
          [1100, 130],
          [1600, 155],
        ].forEach(([x, y]) => {
          ctx.save();
          ctx.translate(x, y);
          for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.fillRect(-1, -10, 2, 20);
            ctx.rotate(Math.PI / 4);
          }
          ctx.restore();
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.fillStyle = "#c85040";
        ctx.font = "bold 80px serif";
        ctx.textAlign = "center";
        ctx.fillText("KỶ NIỆM 43 NĂM NGÀY NHÀ GIÁO VIỆT NAM", CW / 2, 90);
        ctx.font = "bold 90px serif";
        ctx.fillText("20 - 11", CW / 2, 190);
        ctx.fillStyle = "#e8672a";
        ctx.font = "italic bold 65px Georgia,serif";
        ctx.textAlign = "left";
        ctx.fillText("Gửi lời tri ân", RECT_ND.x + 20, RECT_ND.y - 30);
        drawSunflower(1950, 1080, 120);
        drawSunflower(1860, 1100, 80);
        drawStar(100, 830, 36, "#e8a060", 0.8);
        drawStar(150, 880, 25, "#f0b070", 0.7);
        drawStar(80, 900, 20, "#e8c090", 0.6);
      }

      function drawSunflower(cx, cy, r) {
        for (let i = 0; i < 14; i++) {
          let a = (i / 14) * Math.PI * 2;
          ctx.beginPath();
          ctx.ellipse(
            cx + Math.cos(a) * r * 0.78,
            cy + Math.sin(a) * r * 0.78,
            r * 0.22,
            r * 0.48,
            a,
            0,
            Math.PI * 2,
          );
          ctx.fillStyle = "#f5b800";
          ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = "#7a4200";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.15, 0, Math.PI * 2);
        ctx.fillStyle = "#5a3000";
        ctx.fill();
      }
      function drawStar(cx, cy, r, color, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          let a = ((i * 4) / 5 - 0.5) * Math.PI;
          let x = cx + r * Math.cos(a),
            y = cy + r * Math.sin(a);
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.lineTo(x + w, y + h - r);
        ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h);
        ctx.arcTo(x, y + h, x, y + h - r, r);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.closePath();
      }

      function redraw() {
        ctx.clearRect(0, 0, CW, CH);
        drawBackground();

        ctx.save();
        ctx.beginPath();
        ctx.arc(CIRCLE.x, CIRCLE.y, CIRCLE.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.fill();
        ctx.restore();

        if (userImg) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(CIRCLE.x, CIRCLE.y, CIRCLE.r - 4, 0, Math.PI * 2);
          ctx.clip();
          const iw = userImg.width * imgScale,
            ih = userImg.height * imgScale;
          ctx.drawImage(
            userImg,
            CIRCLE.x - iw / 2 + imgX,
            CIRCLE.y - ih / 2 + imgY,
            iw,
            ih,
          );
          ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(CIRCLE.x, CIRCLE.y, CIRCLE.r, 0, Math.PI * 2);
        ctx.strokeStyle = "#e8a060";
        ctx.lineWidth = 6;
        ctx.stroke();

        //ctx.save();
        // roundRect(RECT_CAM.x, RECT_CAM.y, RECT_CAM.w, RECT_CAM.h, 20);
        // ctx.fillStyle = "#e8672a";
        // ctx.fill();
        // ctx.restore();

        const ten = document.getElementById("tenInput").value.trim();
        const cv = document.getElementById("cvInput").value.trim();

        if (ten) {
          ctx.fillStyle = "#fff";
          ctx.font = `bold 58px 'Be Vietnam Pro',sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const tenY = cv
            ? RECT_CAM.y + RECT_CAM.h * 0.38
            : RECT_CAM.y + RECT_CAM.h * 0.5;
          ctx.fillText(ten, RECT_CAM.x + RECT_CAM.w / 2, tenY);
        }
        if (cv) {
          ctx.fillStyle = "rgba(255,255,255,0.9)";
          ctx.font = `36px 'Be Vietnam Pro',sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const cvY = ten
            ? RECT_CAM.y + RECT_CAM.h * 0.72
            : RECT_CAM.y + RECT_CAM.h * 0.5;
          wrapText(
            ctx,
            cv,
            RECT_CAM.x + RECT_CAM.w / 2,
            cvY,
            RECT_CAM.w - 40,
            42,
          );
        }
        ctx.textBaseline = "alphabetic";

        // ctx.save();
        // roundRect(RECT_ND.x, RECT_ND.y, RECT_ND.w, RECT_ND.h, 18);
        // ctx.fillStyle = "rgba(255,255,255,0.88)";
        // ctx.fill();
        // ctx.strokeStyle = "#e8a060";
        // ctx.lineWidth = 4;
        // ctx.stroke();
        // ctx.restore();

        const nd = document.getElementById("ndInput").value.trim();
        if (nd) {
          ctx.fillStyle = "#3a2010";
          ctx.font = `38px 'Be Vietnam Pro',sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "top";
          wrapTextJustify(
            ctx,
            nd,
            RECT_ND.x + 40,
            RECT_ND.y + 40,
            RECT_ND.w - 80,
            54,
          );
          ctx.textBaseline = "alphabetic";
        }
      }

      function wrapText(ctx, text, cx, y, maxW, lineH) {
        const words = text.split(" ");
        let line = "",
          lines = [];
        for (let w of words) {
          const test = line + (line ? " " : "") + w;
          if (ctx.measureText(test).width > maxW && line) {
            lines.push(line);
            line = w;
          } else line = test;
        }
        if (line) lines.push(line);
        const startY = y - (lines.length * lineH) / 2;
        lines.forEach((l, i) =>
          ctx.fillText(l, cx, startY + i * lineH + lineH / 2),
        );
      }

      function wrapTextJustify(ctx, text, x, y, maxW, lineH) {
        const paragraphs = text.split("\n");
        let curY = y;
        for (const para of paragraphs) {
          const words = para
            .trim()
            .split(" ")
            .filter((w) => w);
          if (!words.length) {
            curY += lineH;
            continue;
          }
          let lines = [],
            line = [];
          for (let w of words) {
            const test = [...line, w].join(" ");
            if (ctx.measureText(test).width > maxW && line.length) {
              lines.push(line);
              line = [w];
            } else line.push(w);
          }
          if (line.length) lines.push(line);
          for (let li = 0; li < lines.length; li++) {
            const ln = lines[li];
            if (curY + lineH > y + RECT_ND.h - 40) break;
            if (li === lines.length - 1 || ln.length === 1) {
              ctx.textAlign = "left";
              ctx.fillText(ln.join(" "), x, curY);
              ctx.textAlign = "center";
            } else {
              const totalWordW = ln.reduce(
                (s, w) => s + ctx.measureText(w).width,
                0,
              );
              const gap = (maxW - totalWordW) / (ln.length - 1);
              let cx2 = x;
              for (let w of ln) {
                ctx.textAlign = "left";
                ctx.fillText(w, cx2, curY);
                cx2 += ctx.measureText(w).width + gap;
              }
            }
            curY += lineH;
          }
        }
        ctx.textAlign = "center";
      }

      function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            userImg = img;
            const fit = Math.max(
              (CIRCLE.r * 2) / img.width,
              (CIRCLE.r * 2) / img.height,
            );
            imgScale = fit;
            imgX = 0;
            imgY = 0;
            document.getElementById("scaleSlider").value = Math.round(
              fit * 100,
            );
            document.getElementById("scaleVal").textContent =
              Math.round(fit * 100) + "%";
            document.getElementById("adjGroup").classList.add("show");
            document.getElementById("uploadZone").classList.add("has-img");
            document.getElementById("uploadZone").querySelector("p").innerHTML =
              "<strong>✓ Đã chọn ảnh</strong><br>Nhấn để thay ảnh khác";
            redraw();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      function updateScale(el) {
        imgScale = el.value / 100;
        document.getElementById("scaleVal").textContent = el.value + "%";
        redraw();
      }

      function canvasCoord(e) {
        const rect = cvs.getBoundingClientRect();
        const scaleX = CW / rect.width,
          scaleY = CH / rect.height;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
        };
      }
      function inCircle(px, py) {
        return Math.hypot(px - CIRCLE.x, py - CIRCLE.y) <= CIRCLE.r;
      }

      cvs.addEventListener("mousedown", (e) => {
        const p = canvasCoord(e);
        if (userImg && inCircle(p.x, p.y)) {
          isDragging = true;
          dragStartX = p.x;
          dragStartY = p.y;
          dragImgX = imgX;
          dragImgY = imgY;
          cvs.style.cursor = "grabbing";
        }
      });
      cvs.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const p = canvasCoord(e);
        imgX = dragImgX + (p.x - dragStartX);
        imgY = dragImgY + (p.y - dragStartY);
        redraw();
      });
      cvs.addEventListener("mouseup", () => {
        isDragging = false;
        cvs.style.cursor = "crosshair";
      });
      cvs.addEventListener("mouseleave", () => {
        isDragging = false;
      });
      cvs.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          const p = canvasCoord(e);
          if (userImg && inCircle(p.x, p.y)) {
            isDragging = true;
            dragStartX = p.x;
            dragStartY = p.y;
            dragImgX = imgX;
            dragImgY = imgY;
          }
        },
        { passive: false },
      );
      cvs.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();
          if (!isDragging) return;
          const p = canvasCoord(e);
          imgX = dragImgX + (p.x - dragStartX);
          imgY = dragImgY + (p.y - dragStartY);
          redraw();
        },
        { passive: false },
      );
      cvs.addEventListener("touchend", () => {
        isDragging = false;
      });

      async function downloadAndSave() {
        const btn = document.getElementById("btnTai");
        const status = document.getElementById("saveStatus");
        btn.disabled = true;
        btn.textContent = "⏳ Đang xử lý...";
        status.textContent = "";
        status.className = "save-status";

        redraw();

        // Tải ảnh về máy
        const a = document.createElement("a");
        a.download = "ky-niem-20-11.png";
        a.href = cvs.toDataURL("image/png");
        a.click();

        const ten = document.getElementById("tenInput").value.trim();
        const cv = document.getElementById("cvInput").value.trim();
        const nd = document.getElementById("ndInput").value.trim();
        const base64 = cvs.toDataURL("image/png").split(",")[1];

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              hoTen: ten,
              chucVu: cv,
              noiDung: nd,
              thoiGian: new Date().toLocaleString("vi-VN"),
              imageBase64: base64,
            }),
          });
          status.textContent = "✓ Đã lưu thông tin thành công";
          status.className = "save-status ok";
        } catch (err) {
          status.textContent = "⚠ Không thể lưu (kiểm tra URL Apps Script)";
          status.className = "save-status err";
        }

        btn.disabled = false;
        btn.textContent = "⬇️ Tải ảnh về";
      }

      redraw();
    </script>
  </body>
</html>
